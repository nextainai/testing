<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Free Hosting Service</title>
</head>
<body>
  <h1>Free Website Hosting</h1>
  <form id="hostingForm">
    <input type="text" id="subdomain" placeholder="Choose a subdomain (e.g., my site)" required>
    <button type="submit">Request Hosting</button>
  </form>
  <div id="result"></div>

  <script>
    document.getElementById('hostingForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const subdomain = document.getElementById('subdomain').value;
      const response = await fetch('/.netlify/functions/request-hosting', {
        method: 'POST',
        body: JSON.stringify({ subdomain }),
        headers: { 'Content-Type': 'application/json' },
      });
      const data = await response.json();
      document.getElementById('result').innerText = data.message;
    });
  </script>
</body>
</html>
