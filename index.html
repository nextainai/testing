<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Hosting for Small Websites</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f4f4f4; }
    .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
    h1 { text-align: center; }
    form { display: flex; flex-direction: column; gap: 10px; }
    input, button { padding: 10px; font-size: 16px; }
    button { background: #007bff; color: white; border: none; cursor: pointer; }
    button:hover { background: #0056b3; }
    #result { margin-top: 20px; color: #333; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Free Hosting for Small Websites</h1>
    <p>Sign up to host your small website for free! You'll get a subdomain like <code>yourname.freehostingsite.net</code>.</p>
    <form id="hostingForm">
      <input type="text" id="username" placeholder="Your username (e.g., my site)" required>
      <input type="email" id="email" placeholder="Your email" required>
      <button type="submit">Request Hosting</button>
    </form>
    <div id="result"></div>
  </div>

  <script>
    document.getElementById('hostingForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const email = document.getElementById('email').value;

      const response = await fetch('/.netlify/functions/request-hosting', {
        method: 'POST',
        body: JSON.stringify({ username, email }),
        headers: { 'Content-Type': 'application/json' },
      });
      const data = await response.json();
      document.getElementById('result').innerText = data.message;
    });
  </script>
</body>
</html>
